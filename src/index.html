<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f4eedf" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121014" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Paradise Lost">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Paradise Lost</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=IM+Fell+English:ital@0;1&family=IM+Fell+English+SC&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="topbar">
  <button id="back" class="icon-btn" aria-label="Back" title="Back" hidden>
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </button>
  <a href="#/" id="title" class="topbar-title">Paradise Lost</a>
  <button id="plain" class="icon-btn" aria-label="Plain text" title="Plain text: hide notes" aria-pressed="false" hidden>
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 6.5h14M5 10.5h14M5 14.5h14M5 18.5h9" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
  </button>
  <button id="listen" class="icon-btn" aria-label="Read-along: listen and follow the words" title="Listen: read-along" aria-pressed="false" hidden>
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4.5 14v-2a7.5 7.5 0 0 1 15 0v2M4.5 14h3v5.5h-1.2a1.8 1.8 0 0 1-1.8-1.8zM19.5 14h-3v5.5h1.2a1.8 1.8 0 0 0 1.8-1.8z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round"/></svg>
  </button>
  <button id="dict" class="icon-btn" aria-label="Dictionary: tap any word for its meaning and etymology" title="Dictionary: tap any word" aria-pressed="false" hidden>
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5.5 4.5h11.2a1.8 1.8 0 0 1 1.8 1.8v13.2H7.3a1.8 1.8 0 0 1-1.8-1.8zM5.5 17.7a1.8 1.8 0 0 1 1.8-1.8h11.2" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M9.2 13l2.2-5.6L13.6 13M9.9 11.3h3" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </button>
  <button id="layout" class="icon-btn" aria-label="Reading layout" title="Reading layout" aria-haspopup="true" aria-expanded="false" hidden>
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 6.2C9.6 4.8 6.6 4.6 3.6 5.4v12.6c3-.8 6-.6 8.4.8 2.400-1.400 5.400-1.600 8.400-.8V5.400c-3-.8-6-.6-8.400.8zM12 6.200V18.800" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg>
  </button>
  <a id="signin" class="topbar-link" href="/auth/login?back=/" hidden>Sign in</a>
  <button id="acct" class="icon-btn acct" aria-label="Account" title="Account" hidden></button>
  <button id="textsize" class="icon-btn ts-btn" aria-label="Text size: normal" title="Text size"><b>A</b><i>A</i></button>
  <button id="theme" class="icon-btn" aria-label="Theme: light, dark or dim" title="Theme: light, dark or dim">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12 4a8 8 0 0 1 0 16a4 4 0 0 1 0-8a4 4 0 0 0 0-8z" fill="currentColor"/></svg>
  </button>
  <button id="menu" class="icon-btn" aria-label="Menu: text size, theme and features" title="Menu" aria-haspopup="dialog" aria-expanded="false">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4.5 7h15M4.5 12h15M4.5 17h15" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></svg>
  </button>
  <div class="progress" id="progress" hidden></div>
</header>
<div class="layout-menu" id="layout-menu" role="menu" aria-label="Reading layout" hidden><button type="button" role="menuitemradio" class="lm-item" data-mode="scroll"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4h10M7 9h10M7 14h10M7 19h6" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg><span>Scroll</span></button><button type="button" role="menuitemradio" class="lm-item" data-mode="page"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="3.5" width="12" height="17" rx="1.2" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M9 8.5h6M9 12h6M9 15.5h4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg><span>Page</span></button><button type="button" role="menuitemradio" class="lm-item wide-only" data-mode="spread"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5.5C9.5 4 6.5 4 3.5 5v13.5c3-1 6-1 8.5.5 2.500-1.500 5.500-1.500 8.500-.5V5c-3-1-6-1-8.500.5zM12 5.500V19" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg><span>Two pages</span></button></div>
<main id="app"></main>
<footer class="site-foot" id="site-foot"><span>Made with love in New Orleans <span class="heart" aria-hidden="true">❤</span> by <a href="https://benbybenjacobs.com" rel="noopener">Ben Jacobs</a></span> · <a href="#/credits">Credits and copyright</a> · <a href="#/privacy">Privacy</a></footer>
<div class="dict-hint" id="dict-hint" role="status" hidden>Dictionary on · tap a word</div>
<div class="note-card" id="note-card" role="dialog" aria-labelledby="nc-word" hidden>
  <div class="nc-head">
    <div class="nc-word" id="nc-word"></div>
    <button type="button" class="icon-btn" id="nc-close" aria-label="Close note" title="Close">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    </button>
  </div>
  <p id="nc-text"></p>
  <div id="nc-dict" class="nc-dict" aria-live="polite" hidden></div>
  <button type="button" class="nc-ask" id="nc-dictbtn" hidden>Dictionary and etymology ›</button>
  <div class="nc-fn" id="nc-fn" hidden></div>
  <button type="button" class="nc-ask" id="nc-ask">Ask the Reader ›</button>
</div>
<dialog id="lb" class="lb" aria-label="Plate">
  <button type="button" class="icon-btn" id="lb-close" aria-label="Close">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
  </button>
  <img id="lb-img" alt="">
  <p id="lb-cap"></p>
</dialog>
<script src="data.js"></script>
<script src="art.js"></script>
<script src="notes.js"></script>
<script src="chat.js"></script>
<script src="app.js"></script>
</body>
</html>
